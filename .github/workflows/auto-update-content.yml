name: Daily Content Update
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: commit and push content
          run: | 
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/
            if ! git diff --cached --quiet; then
              git commit -m "chore: daily content update $(date -u +'%Y-%m-%d %H:%M:%S EDT')"
              git push 
            else 
              echo "no changes in content folder"
            fi 
